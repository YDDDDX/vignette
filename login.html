<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vignette - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="cover-logo" href="./index.html" aria-label="Vignette 首页">
        <span class="brand-mark" aria-hidden="true">V</span>
        <strong>Vignette</strong>
      </a>

      <section class="login-card" aria-labelledby="loginTitle">
        <p class="eyebrow">Account</p>
        <h1 id="loginTitle">登录后继续生成广告。</h1>
        <p>你的 Agent 分析、创意简报和后续生成记录会绑定到账号。现在也可以先跳过登录完成演示。</p>

        <a class="primary-button login-continue" href="./intake.html" id="continueWithoutLogin">
          <i data-lucide="arrow-right"></i>
          继续体验
        </a>

        <div class="login-divider"><span>邮箱账号</span></div>

        <div class="grid two login-fields">
          <label class="field">
            <span>邮箱</span>
            <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="loginPassword" type="password" placeholder="至少 6 位" autocomplete="current-password" />
          </label>
        </div>

        <div class="login-actions">
          <button class="primary-button" type="button" id="loginPasswordButton">
            <i data-lucide="log-in"></i>
            登录
          </button>
          <button class="secondary-button" type="button" id="signupPasswordButton">
            注册账号
            <i data-lucide="user-plus"></i>
          </button>
        </div>

        <details class="magic-link-panel">
          <summary>使用邮箱魔法链接</summary>
          <p>如果密码登录不方便，可以发送一次性登录链接。请检查垃圾邮件箱。</p>
          <button class="secondary-button login-email" type="button" id="loginEmailButton">
            发送魔法链接
            <i data-lucide="mail"></i>
          </button>
        </details>

        <button class="secondary-button login-google" type="button" id="loginGoogle" hidden>
          <i data-lucide="log-in"></i>
          使用 Google 登录
        </button>

        <p class="login-status" id="loginStatus" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./vendor/supabase.min.js"></script>
    <script src="./auth.js"></script>
    <script src="./login.js"></script>
  </body>
</html>
