<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vignette - Brief History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="history-page">
    <main class="history-shell">
      <nav class="history-nav" aria-label="顶部导航">
        <a class="cover-logo" href="./index.html" aria-label="Vignette 首页">
          <span class="brand-mark" aria-hidden="true">V</span>
          <strong>Vignette</strong>
        </a>
        <div class="nav-actions">
          <a class="account-link" href="./login.html?returnTo=/history.html" data-auth-link data-auth-label="登录同步历史">
            <i data-lucide="user-round"></i>
            登录同步历史
          </a>
          <a class="nav-action" href="./intake.html">
            <i data-lucide="sparkles"></i>
            新建 Brief
          </a>
        </div>
      </nav>

      <header class="history-hero">
        <div>
          <p class="eyebrow">Brief History</p>
          <h1>历史创意简报</h1>
          <p>每次生成 Brief 后会先保存到当前浏览器；登录后会尝试同步到 Supabase，方便后续做账号记录。</p>
        </div>
        <a class="secondary-button" href="./details.html">
          手动填写
          <i data-lucide="arrow-right"></i>
        </a>
      </header>

      <section class="history-status" id="historyStatus" aria-live="polite"></section>
      <section class="history-grid" id="historyGrid" aria-label="历史记录"></section>
    </main>

    <template id="emptyHistoryTemplate">
      <div class="history-empty">
        <i data-lucide="folder-clock"></i>
        <h2>还没有历史 Brief</h2>
        <p>去 Agent 或详细填写页生成一条，系统会把 Live Brief、表单字段和测试计划保存下来。</p>
        <a class="primary-button" href="./intake.html">
          生成第一条
          <i data-lucide="arrow-right"></i>
        </a>
      </div>
    </template>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./vendor/supabase.min.js"></script>
    <script src="./auth.js"></script>
    <script src="./auth-ui.js?v=20260612"></script>
    <script src="./history-store.js?v=20260612"></script>
    <script src="./history.js?v=20260612"></script>
  </body>
</html>
